paths:
  contracts: contracts
  artifacts: artifacts

networks:
  default: localnet
  localnet:
    url: "http://127.0.0.1:4000/api"
  # GenLayer Studio-dev, chain 61997 — where the Phage contract is deployed.
  studio_devnet:
    url: "https://studio-dev.genlayer.com/api"
  studionet:
    url: "https://studio.genlayer.com/api"

# NOTE: `studio_devnet` requires gltest >= 0.30.0rc2 / genlayer-py >= 0.19.0rc2. On the
# older stable toolchain (gltest 0.29.2) the Python SDK ships no studio-dev chain at all —
# its `studionet` is chain id 61999 — and `chain_type` is restricted to a fixed list, so a
# studio-dev network is unreachable and calls fail with `malformed_entry`. The dependency
# pins are recorded in requirements.txt; install with `--prerelease=allow`, since the
# matching toolchain for studio-dev is still on the release-candidate line.
